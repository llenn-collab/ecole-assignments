      PROJECT 03 PART 1
      PORTFOLIO WEBSITE
      Objective:
      Conceptualising and visualising key pages of your web portfolio to be distinct, with a strong
      narrative style and clarity in flow of work being presented.
      Project Progression: 3 Weeks
      19 Oct: Website Homepage + About Me Page – Content Wireframe & Visual Plan
      27 Oct: Website Portfolio Landing Page + One Project Page – Content & Visual Plan
      03 Nov: NLET Submission
      Deliverables:
      Your Portfolio Link must have the following pages working:
      1. Home Page – Completed
      2. About Me – Completed
      3. Portfolio – Landing Page + Any Two Projects Completed
      Grading Criteria:
      Narrative Uniqueness: Has a clear visual / verbal theme
      Home page information hierarchy and user experience
      Portfolio – Project Page: Concise and clear showcase of work
      Please note: There is no mandatory WIP discussions while your build this assignment. However,
