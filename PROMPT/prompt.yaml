        - "yongshen_candidates_unbound"
      outputs:
        - "raw/state/schema_bind.json"
        - "raw/state/pillars.json"
        - "raw/state/season.json"
        - "raw/state/duty.json"
        - "raw/state/indexes.json"
        - "raw/state/origin_sets.json"
        - "raw/state/lodging.json"
        - "raw/state/yongshen.json"
    P1_TO_P4_OPERATOR_ZOOM:
      keep_order:
        - "B1"
        - "B2"
        - "B3"
        - "B4"
      selector_policy: "sets + proxies + geometry table; never array position"
      palace_stack:
        - "S1"
        - "S2"
        - "S3"
        - "S4"
        - "S5"
        - "S6"
        - "S7"
        - "S8"
        - "S9"
        - "S10"
        - "S11"
        - "S12"
      side_traces_do_not_replace_operator:
        - "hidden"
        - "lodged"
        - "tomb"
        - "punishment"
    P5_REMAINING:
      id: "B5"
      order_source:
        preferred: "chart_metadata.palace_order"
        fallback:
          - "Luo Shu 1 to 9"
          - "direction compass order"
          - "JSON key order"
      confirm_veto_pass_on_already_read_palaces: true
    P6_BOARD_SYNTHESIS:
      after:
        - "B5"
      before:
        - "SYNTHESIZE"
      steps:
        - "door_system_map"
        - "star_system_map"
        - "spirit_two_plate_map"
        - "sanqi_liuyi_map"
        - "wangshuai_matrix"
        - "void_tomb_punish_force_horse_graph"
        - "inner_outer"
        - "pillars_times_palaces"
        - "reconstitute_center"
        - "pattern_catalog"
        - "bind_yongshen_with_pdf"
        - "rank_paths_operator_only"
      outputs:
        - "raw/state/systems.json"
        - "raw/state/relations.json"
        - "raw/state/patterns.json"
        - "wiki/Chart-Working-Copy.md"
        - "wiki/Chart-Board-Synthesis.md"
        - "wiki/Chart-Patterns.md"
    P7_SLOT_BIND:
      explicit_json_slots_first: true
      else: "interpretation_protocol_v2"
      inferred_never_ships_as_verdict: true
  four_pillars_protocol:
    read:
      - "year"
      - "month"
      - "day"
      - "hour"
    each:
      - "stem"
      - "branch"
      - "polar"
      - "element"
    then_compute:
      - "repeated_branches"
      - "clashes_punishments_combinations_harms"
      - "stem_production_and_control_chain"
      - "project_each_branch_to_palace_via_identity_table"
      - "project_each_stem_via_stem_index"
      - "void_membership of year/month/day/hour branches"
    sample_alerts:
      - "month+day+hour all Monkey (Shen): stack on Kun, self-punishment climate"
      - "year Horse is day-void and sits on Li"
      - "day Wood vs seasonal wood dead"
  jia_protocol:
    if_day_gan_on_heaven: "B1 primary = those palaces"
    if_not:
      log: "ANOMALY:day_stem_not_on_heaven"
      origin_set:
        - role: "proxy_lead_wu"
          how: "heaven_plate.stem matches the visible stand-in stem from lead_stem, especially Wu when lead is Jia Zi Wu"
        - role: "duty_star_palace"
          how: "duty_star.palace_number"
        - role: "tomb_of_day_gan"
          how: "tomb_stems contains day gan"
        - role: "earth_or_hidden"
          how: "earth_plate.stem or hidden_stem contains day gan"
      analyse_all: true
      pick_random: false
      opposite_each_non_center: true
  lodging_protocol:
    trigger: >
      Palace 5 heaven/door null, notes mention lodged, lodged_star/lodged_stem present,
      or duty_door.original_palace != duty_door.active_palace.
    action: >
      Build a lodging graph. Centre remains NO_OPPOSITE pivot. Lodgers are analysed in their
      host palaces with role lodged_from_center. Do not force Centre into a pair.
    example_from_sample_chart:
      - from: "5"
        to: "7"
        items:
          - "Tian Qin (Flail)"
          - "Yin Wood (Yi)"
      - from: "5"
        to: "2"
        items:
          - "Delusion Door"
  palace_stack:
    S1_identity:
      - "id"
      - "name"
      - "direction"
      - "element"
      - "earthly_branches"
      - "plate_division"
      - "palace_strength"
    S2_earth:
      - "earth_plate.stem"
      - "earth_plate.spirit"
    S3_door:
      - "door.name"
      - "door.forced"
      - "door.strength"
    S4_heaven:
      - "heaven_plate.stem"
      - "heaven_plate.star"
      - "heaven_plate.spirit"
      - "heaven_plate.lodged_star"
      - "heaven_plate.lodged_stem"
      - "heaven_plate.notes"
      - "heaven_plate.star_strength.by_palace"
      - "heaven_plate.star_strength.by_season"
    S5_hidden:
      - "hidden_stem"
    S6_markers:
      - "markers.void"
      - "markers.horse_star"
      - "markers.duty_star"
      - "markers.duty_door"
      - "markers.hour_stem_focus"
      - "markers.plate_in_tomb"
      - "markers.plate_in_punishment"
    S7_lists:
      - "tomb_stems"
      - "punishment_stems"
    S8_relations: "compute intra-palace relations; do not narrate without paths"
    S9_index_pull: "retrieve stem/door/star/spirit occurrences elsewhere"
    S10_role_overlay: "append-only"
    S11_verdicts: "typed objects; EXPLICIT vs COMPUTED vs INFERRED"
    S12_patch: "solution.json + palaces.json + progress.md"
  grounding_values_add:
    - "EXPLICIT"
    - "COMPUTED"
    - "INFERRED"
  interpretation_protocol_v2:
    version: "2.0.0"
    demote_v01_traces: "evidence class only"
    classes:
      - class: "explicit_slot"
        slot: "as named"
        grounding: "EXPLICIT"
      - class: "day_stem_or_jia_set"
        slot_bias: "my_answers"
      - class: "hour_stem_or_focus"
        slot_bias: "timing/execution"
      - class: "duty_star"
        slot_bias: "authority of brief"
      - class: "duty_door_forced_dead"
        slot_bias: "hidden_problems / method to avoid"
      - class: "tian_yi"
        slot_bias: "help/quality"
      - class: "backward_trace"
        slot_bias: "root constraint"
      - class: "forward_trace"
        slot_bias: "if-proceed"
      - class: "opposite"
        slot_bias: "cost/check"
      - class: "tomb_of_yongshen"
        slot_bias: "hidden_problems"
      - class: "void_on_showpiece"
        slot_bias: "will_not_land"
      - class: "forced_door"
        slot_bias: "coerced method"
      - class: "seasonal_death_of_day_element"
        slot_bias: "climate trap"
      - class: "horse_plus_open"
        slot_bias: "best_solution movement"
      - class: "sanqi_with_good_door"
        slot_bias: "best_solution quality"
      - class: "inner"
        slot_bias: "process"
      - class: "outer"
        slot_bias: "surface/audience"
      - class: "lodged_from_center"
        slot_bias: "displaced core"
      - class: "stacked_branch"
        slot_bias: "locked timing"
      - class: "lead_stem_proxy"
        slot_bias: "visible stand-in for invisible day stem"
    overload_rule: >
      One palace may carry opposite polarities. Split claims. Do not average an overloaded
      palace into a single score. If help, trap, timing, and authority co-exist in the same
      palace, create separate typed claims with separate evidence paths.
  pattern_catalog_compute_always:
    - "forced_door"
    - "void_palace"
    - "plate_in_tomb"
    - "plate_in_punishment"
    - "stem_in_tomb"
    - "stem_in_punishment"
    - "duty_star"
    - "duty_door"
    - "hour_stem_focus"
    - "horse_star"
    - "heaven_earth_stem_pair"
    - "star_sitting_home"
    - "door_at_original_palace"
    - "lodged_star_or_stem"
    - "empty_center"
    - "split_star_strength"
    - "seasonal_vs_day_element"
    - "sanqi_positions"
    - "stacked_pillar_branch_on_palace"
  pattern_catalog_name_only_if_both_pieces_exist:
    - name: "heavenly_escape"
      pieces:
        - "Yang Fire (Bing)"
        - "Open Door"
    - name: "human_escape"
      pieces:
        - "Yin Fire (Ding)"
        - "Open Door"
    - name: "earthly_escape"
      pieces:
        - "Yin Wood (Yi)"
        - "Rest Door"
      school_variant: true
      if_unsure: "store_combination_only"
  pattern_rule: "Store unnamed combinations rather than skip them. Do not invent names. Do not compute a chart structure and rebuild the plate."
  validation:
    void: "metadata void branches vs markers.void vs earthly_branches"
    horse: "horse_branch table vs markers.horse_star"
    duty: "metadata palace numbers vs markers"
    mismatch: "ANOMALY; do not overwrite JSON"
  inner_outer_system:
    inner_palaces:
      - "2"
      - "6"
      - "7"
      - "9"
      - "5"
    outer_palaces:
      - "1"
      - "3"
      - "4"
      - "8"
    meaning:
      inner: "process, constraint, institution, internal rationale"
      outer: "audience, surface, movement, submission-facing behaviour"
  wangshuai_matrix:
    rows: "nine palaces"
    columns:
      - "seasonal_element_strength"
      - "palace_strength"
      - "star_strength.by_palace"
      - "star_strength.by_season"
      - "door_strength"
    include_exhausted: true
    rule: "Record concordant vs split strength. Split strength means looks strong but climate says no, or reverse."
  operator_path_rank:
    enabled: true
    output: "vault/output/OPERATOR/PATH_RANK.md"
    isolation: "never in SUBMISSION or ANNOTATED"
    method: >
      Compute an operator-only rank of paths vs traps from systems.json, patterns.json,
      origin_sets.json, and yongshen.json. The rank is a computed aid, not a chart field,
      and never masquerades as an explicit JSON value.
  source_change_policy:
    if_later_file_adds_explicit_slots_or_patterns: >
      If a later source revision adds explicit my_answers, hidden_problems, best_solution,
      yongshen, or pattern fields, those become EXPLICIT and outrank protocol v2.
      Enter SOURCE_CHANGED, rebind, and re-run affected phases.
  agent_loop_insert:
    after_CHART_INGEST: "P0_ANATOMY"
    after_B5_before_SYNTHESIZE: "P6_BOARD_SYNTHESIS"

assignment_ingest:
  state_name: "PDF_INGEST"
  required_before:
    - "PURGE_B1"
    - "B1"
  outputs:
    - "raw/assignment/extract.md"
    - "raw/assignment/images/"
    - "wiki/Assignment-Brief.md"
    - "wiki/Assignment-Corpus.md"
    - "wiki/Requirements-Matrix.md"
    - "wiki/Rubric-Guess.md"
    - "wiki/Logo-Boundary.md"
    - "wiki/Constraints-And-Deliverables.md"
    - "raw/state/deliverable_registry.json"
  procedure:
    - "Extract all pages, headings, tables, captions, footnotes, rubric sections, and submission instructions."
    - "Quote constraints with page anchors or stable location anchors."
    - "Classify rubric verbs: must, should, may, must not, do not, exclude."
    - "Identify artefact types: PDF, PPT, copy deck, brand book, report, code, video script, naming, rationale, checklist, etc."
    - "Build DeliverableRegistry from the PDF, not from a fixed template."
    - "Build Requirements-Matrix rows with requirement id, quoted text, page anchor, artefact type, must/should/may, except-logo flag, audience, coverage status."
    - "Build Logo-Boundary include/exclude lists."
    - "Extract images and visual references into raw/assignment/images/ and cite them; do not redraw them."
  deliverable_registry:
    source_of_truth: true
    fields:
      - "id"
      - "name"
      - "format"
      - "mime_type"
      - "audience"
      - "must_or_should"
      - "except_logo"
      - "source_requirement_ids"
      - "output_path"
      - "status"
  logo_boundary_protocol:
    excluded_by_default:
      - "logo mark artwork"
      - "wordmark artwork"
      - "lockup artwork"
      - "favicon artwork"
      - "construction grid artwork"
      - "SVG path artwork"
      - "final rendered logo image"
    included_if_pdf_asks:
      - "logo naming"
      - "positioning"
      - "colour intent"
      - "usage rules"
      - "typographic direction"
      - "visual rationale in words"
      - "design direction written as prose"
    rule: "If ambiguous, exclude visual artwork and include written direction, labelled as design direction not artwork."
  rubric_policy:
    if_rubric_exists: "extract into Rubric-Guess and use for coverage audit"
    if_no_rubric: "set Rubric-Guess status to NONE"
  citation_rule: "Every output section must map to at least one requirement id and PDF anchor in OPERATOR commentary."
  yongshen_binding:
    timing: "Bind yongshen candidates only after PDF ingestion. Before that, keep candidates unbound."

geometry:
  authority: "frozen deterministic tables; not LLM improvisation"
  identity_ref: "#/qmdj_complete/palace_identity_table"
  opposition_ref: "#/qmdj_complete/palace_identity_table/opposition_by_name"
  lodging_ref: "#/qmdj_complete/lodging_protocol"
  selector_policy:
    results_are_sets: true
    allow_multi_match: true
    allow_none: true
    allow_proxy: true
    never_force_single_palace: true
  centre_rule:
    palace_id: "5"
    name: "Center"
    opposite: null
    status: "NO_OPPOSITE"
    procedure:
      - "Log ANOMALY:center_has_no_opposite when an opposite is requested."
      - "Analyse Centre as pivot / emptied / lodging source, not as a paired palace."
      - "Use lodging graph to analyse where Centre content resides."
      - "Do not pick a random second palace to satisfy batch pairing."
  directional_rule:
    principle: "Opposite means true directional opposition from the frozen identity table, verified by canonical English name."
    forbidden:
      - "array index arithmetic"
      - "i + 4 mod 9"
      - "selecting the next JSON key"
      - "guessing by order in an array"
  tracing_algorithm: |
    normalize stems with qmdj_complete.stem_parser
    origin_set = palaces where heaven_plate.stem == target_stem
    if target_stem canonical is Jia and origin_set is empty:
      origin_set = qmdj_complete.jia_protocol.origin_set
    for each origin in origin_set:
      backward_set = palaces where earth_plate.stem == origin.heaven_plate.stem
      forward_set = palaces where heaven_plate.stem == origin.earth_plate.stem
      side_traces = hidden_stem, lodged_stem, tomb_stems, punishment_stems involving origin stems
    if any set length != 1:
      log MULTI_MATCH or NONE or PROXY
      analyse all matches as a set
      do not guess
  matching_rules:
    match_by: "field values"
    never_match_by: "array position"
    normalise_stems: true
    handle_null_and_missing: true
    handle_empty_or_borrowed_stems: true
    unknown_values_policy: "store raw value, label UNRESOLVED, do not drop"

interpretation_protocol:
  active_version: "2.0.0"
  ref: "#/qmdj_complete/interpretation_protocol_v2"
  primary_rule: >
    Prefer explicit fields, tags, comments, metadata, or direct statements in QMDJ.json for
    my_answers, hidden_problems, best_solution, and yongshen. If explicit fields are absent,
    use protocol v2 evidence classes. Traces are one evidence class, not the whole law.
  explicit_slot_binding:
    search_locations:
      - "chart_metadata"
      - "global comments"
      - "palace tags"
      - "palace comments"
      - "verdict fields"
      - "answer fields"
      - "hidden_problem fields"
      - "best_solution fields"
      - "yongshen fields"
      - "any bilingual equivalent field names"
    if_found:
      binding: "direct"
      grounding: "EXPLICIT"
      confidence: "high"
      rule: "Bind directly. Do not override explicit chart content with heuristic protocol."
  fallback_protocol_v2:
    status: "INFERRED unless COMPUTED evidence applies"
    allowed_only_when: "explicit slot fields are absent or incomplete"
    limitation: >
      Protocol v2 claims are hypotheses until Phase 6 confirms them and PDF constraints do not veto.
      They may not be presented as final answers unless promoted by explicit or computed confirmation.
  hypothesis_policy:
    inferred_claims_are_hypotheses_until: "P6_BOARD_SYNTHESIS confirmation"
    presentation_rule: >
      Never present a hypothesis as a verdict in SUBMISSION. If still inferential, either omit it
      or frame it as optional direction only where PDF allows.
  unknown_fields_policy: "Unknown JSON fields are first-class evidence. Store them as opaque evidence. Do not drop them."

domain:
  qmdj_chart:
    file: "raw/QMDJ.json"
    immutable: true
    read_order:
      - "chart_metadata"
      - "P0_ANATOMY objects"
      - "B1-B5 selected palaces"
      - "P6_BOARD_SYNTHESIS board maps"
    status_field_on_each_palace:
      - "unread"
      - "in_phase0"
      - "in_batch"
      - "analysed"
      - "verdicted"
      - "applied_to_solution"
      - "board_synthesised"
    update_policy: >
      Continuously update an in-memory and wiki working copy of the chart.
      After every palace analysis, write or update:
      wiki/Palace-Analysis-Index.md, raw/state/palaces.json, raw/state/solution.json,
      raw/traces/batch-{n}-{palace_id}.md, raw/chart/annotations.json,
      and relevant index/system/pattern state files.
      Re-read chart_metadata after every batch and after Phase 6; if contradiction exists, log and resolve by precedence.
  assignment:
    file: "raw/Assignment.pdf"
    immutable: true
    first_action: "complete analysis and understanding before any palace work"
    extract_into_wiki:
      - "brief / prompt"
      - "required deliverables, minus excluded logo artwork"
      - "constraints, rubric, audience"
      - "implied my answers, hidden problems, best solution slots"
      - "page-anchored requirement matrix"
      - "logo boundary protocol"
    solve_policy: >
      The agent solves the assignment itself.
      QMDJ.json is the authority for explicit answers, hidden problems, and best solution when present.
      If explicit fields are absent, use computed board evidence and InterpretationProtocol v2,
      labelling grounding as COMPUTED or INFERRED. Do not ask the user to clarify the assignment.
      Audit yourself. Cross-check every prescribed solution against the chart and PDF hard constraints.
      A solution is accepted only if it is chart-grounded and PDF-compliant.

batch_engine:
  execution: sequential_blocking
  modes_used:
    - "GEOM"
    - "READ"
    - "PATCH"
    - "LINT"
  selector_law:
    normalise_stems: true
    match_values: true
    results_are_sets: true
    use_proxies_when_operator_rule_yields_none: true
    opposite_from_frozen_table: true
    centre_secondary_not_applicable: true
  after_each_palace:
    - "update working chart"
    - "write raw trace"
    - "update raw/state/palaces.json"
    - "update wiki Palace-Analysis-Index.md"
    - "update Solution-Live and raw/state/solution.json"
    - "update raw/state/indexes.json if new occurrences are discovered"
    - "update raw/state/relations.json with S8 relations"
    - "if the palace supports, constrains, sequences, warns, splits, or vetoes a solution claim, patch the relevant wiki article"
    - "run local consistency check: claim ↔ chart evidence"
    - "run local geometry lint"
    - "run local coverage lint for newly affected requirements"
    - "update raw/state/progress.md heartbeat"
  after_each_batch:
    - "re-check chart_metadata for contradictions"
    - "rebuild MOC"
    - "update ANNOTATED/00_STATUS.md"
    - "run stale-dependency scan"
    - "validate markers vs computed checks where applicable"
  purge_policy:
    B1_redo:
      purge_before_execute: true
      actions:
        - "delete or archive raw/traces/batch-1-*"
        - "strip Palace-Analysis-Index rows with batch_id=B1"
        - "remove B1-only verdicts from raw/state/solution.json"
        - "keep B2+ traces but flag STALE_IF_DEPENDS_ON_B1"
        - "record purge event in Risk-And-Audit-Log"
      idempotency_key:
        - "run_id"
        - "batch_id"
        - "palace_id"
  batches:
    B1:
      id: "B1"
      title: "Day-stem palace set and directional opposites"
      redo: true
      purge_before_run: true
      select:
        primary_rule: "palaces where heaven_plate.stem == chart day_stem after stem parsing"
        if_none: "apply qmdj_complete.jia_protocol origin_set"
        secondary_rule: "for each non-center origin, select opposite by geometry opposition_by_name"
      procedure:
        - "locate primary set by heaven_plate.stem match on day_stem"
        - "if primary set is empty and day stem is Jia, build origin_set via Jia protocol"
        - "locate opposites by canonical name opposition table; verify on chart"
        - "if origin is Centre, apply centre lodging protocol and no fake opposite"
        - "analyse every selected palace fully using palace_stack S1-S12"
        - "extract explicit verdicts first; computed relations second; inferred candidate verdicts third"
        - "write traces, palace cards, role overlays, and state updates"
        - "mark selected palaces analysed and verdicted where appropriate"
        - "label roles so later B5 confirm pass does not double-count unread status"
    B2:
      id: "B2"
      title: "Hour-stem palace set and directional opposites"
      select:
        primary_rule: "palaces where heaven_plate.stem == chart hour_stem"
        attach_rule: "palaces where earth_plate.stem == hour_stem OR markers.hour_stem_focus == true"
        secondary_rule: "for each non-center primary, select opposite by geometry opposition_by_name"
      procedure:
        - "same depth as B1"
        - "treat hour-stem results as a set, not a single cell"
        - "honour markers.hour_stem_focus as evidence, not decoration"
        - "do not reuse B1 conclusions unless the chart independently re-supports them"
        - "reconcile B2 vs B1 conflicts into wiki/Risk-And-Audit-Log.md"
        - "if hour_stem is missing, log ANOMALY:missing_hour_stem and handle under partial-chart policy"
    B3:
      id: "B3"
      title: "Day-stem tracing backward and forward"
      origin: "day_stem origin set identified in B1"
      traces:
        backward:
          rule: "For each origin, find palaces where earth_plate.stem == origin.heaven_plate.stem."
          meaning_hint: "candidate origin-condition / root constraint / hidden problem"
          grounding_default: "INFERRED unless explicit or computed evidence upgrades it"
        forward:
          rule: "For each origin, find palaces where heaven_plate.stem == origin.earth_plate.stem."
          meaning_hint: "candidate unfolding / downstream consequence / best solution path"
          grounding_default: "INFERRED unless explicit or computed evidence upgrades it"
        side_traces:
          - "hidden_stem hits involving origin stems"
          - "lodged_stem hits involving origin stems"
          - "tomb_stems hits involving origin stems"
          - "punishment_stems hits involving origin stems"
      procedure:
        - "resolve all target sets from the origin's stems using value matching, not memory"
        - "if origin is a set, each origin produces its own forward/backward traces"
        - "analyse each target fully using palace_stack"
        - "if a target was already analysed, add a role overlay rather than overwriting prior analysis"
        - "side traces augment B3; they do not replace operator heaven-earth traces"
        - "apply verdict effects to hidden problems and best solution path as typed claims"
    B4:
      id: "B4"
      title: "Hour-stem tracing backward and forward"
      origin: "hour_stem origin set identified in B2"
      traces:
        backward:
          rule: "For each origin, find palaces where earth_plate.stem == origin.heaven_plate.stem."
          meaning_hint: "candidate execution constraint / timing trap"
        forward:
          rule: "For each origin, find palaces where heaven_plate.stem == origin.earth_plate.stem."
          meaning_hint: "candidate execution sequence / timing path"
        side_traces:
          - "hidden_stem hits involving origin stems"
          - "lodged_stem hits involving origin stems"
          - "tomb_stems hits involving origin stems"
          - "punishment_stems hits involving origin stems"
      procedure:
        - "identical method to B3, different origin"
        - "overlay roles if palaces already seen"
        - "hour-stem tracing weights timing, sequence, and execution order of the solution"
        - "side traces augment B4; they do not replace operator heaven-earth traces"
    B5:
      id: "B5"
      title: "All remaining palaces plus confirmation/veto pass"
      trigger: "after B4 complete"
      remaining_order:
        preferred: "chart_metadata.palace_order"
        fallback_order:
          - "Luo Shu 1 to 9"
          - "direction compass order"
          - "JSON key order"
        rule: "Record the chosen order in raw/state/palaces.json. Do not leave order implicit."
      procedure:
        - "enumerate palaces still unread or not analysed"
        - "examine each in recorded remaining order"
        - "run a confirmation/veto pass on already-read palaces too, because B5 updates the solution"
        - "use remaining palaces to confirm, constrain, sequence, warn, split, or veto the running solution"
        - "update Solution-Live; never freeze the solution before B5 and Phase 6"
        - "final chart pass: every palace status is analysed, verdicted, or applied_to_solution, with anomalies logged"

solution_engine:
  live_object:
    wiki: "wiki/Solution-Live.md"
    machine: "raw/state/solution.json"
    revisioning:
      increment_on_every_patch: true
      fields:
        - "revision"
        - "updated_at"
        - "updated_by_phase"
        - "updated_by_batch"
        - "updated_by_palace"
    structure:
      answers: []
      hidden_problems: []
      best_solution: {}
      open_questions: []
      evidence: []
      anomalies: []
      split_claims: []
    update_policy: >
      Patch the live solution after every palace, every batch, and every phase.
      Early palaces may steer later reading. B5 updates the solution.
      P6_BOARD_SYNTHESIS updates and ranks the solution board-wide.
      SYNTHESIZE stabilises and freezes the solution, but does not create it from scratch.
  slots:
    my_answers:
      wiki: "wiki/Recommended-Answers.md"
      rule: >
        Only answers grounded by explicit chart fields, computed board evidence, or confirmed
        inferred evidence may be treated as answers. If the chart is silent, state the gap in
        the audit log and choose the least-contradicted option, labelled as least-contradicted,
        not as chart-verdicted.
    hidden_problems:
      wiki: "wiki/Hidden-Problems.md"
      rule: >
        Prefer explicit chart fields first. Then use duty-door traps, void showpieces, tombs,
        punishments, forced doors, seasonal climate against the day element, backward traces,
        and overloaded palace split claims. Hidden means unstated in Assignment.pdf but binding.
    best_solution:
      wiki: "wiki/Solution-Architecture.md"
      rule: >
        Prefer explicit chart fields first. Then use forward traces, horse plus open movement,
        sanqi with good doors, outer surface strength, inner process strength, yongshen binding,
        and Phase 6 path ranking. The solution must be implementable as assignment content
        except excluded logo artwork.
  verdict_object_schema_ref: "#/schemas/verdict"
  verdict_policy:
    typed_only: true
    no_verb_only_verdicts: true
    polarity_values:
      - "SUPPORT"
      - "VETO"
      - "CONSTRAIN"
      - "SEQUENCE"
      - "WARN"
      - "SILENT"
    grounding_values:
      - "EXPLICIT"
      - "COMPUTED"
      - "INFERRED"
    status_values:
      - "live"
      - "superseded"
      - "vetoed"
    split_claim_rule: >
      If one palace produces multiple effects with different polarities, create multiple verdict
      objects. Do not collapse them into one palace-level verdict.
    supersession_rule: >
      Phase 6 or B5 may mark an earlier claim superseded, but must cite both old and new evidence.
      Never silently drop an early verdict.
  yongshen_policy:
    phase0: "store unbound candidates in raw/state/yongshen.json"
    phase6: "bind candidates to PDF question types"
    default_candidates:
      work_or_student_or_my_answers: "day stem plus Jia proxy set"
      marker_or_brief_or_institution: "duty star palace"
      method_or_process: "doors, especially duty door"
      deadline_or_performance_or_now: "hour pillar and hour_stem_focus palaces"
      audience_or_surface: "outer palaces plus Scenery/Open where present"
      need_to_change: "horse palace"
  translation_to_output:
    output_trees:
      submission: "vault/output/SUBMISSION/"
      annotated: "vault/output/ANNOTATED/"
      operator: "vault/output/OPERATOR/"
    strip_terms_in_submission:
      source_file: "vault/wiki/_meta/forbidden_terms.txt"
      defaults_ref: "#/tables/term_denylist_defaults"
    keep_as_english:
      - "the practical recommendation"
      - "the risk"
      - "the sequence of work"
      - "the audience-facing rationale"
      - "the requirement coverage"
    operator_comments: >
      Write OPERATOR/COMMENTS.md, OPERATOR/MAPPINGS.md, and OPERATOR/PATH_RANK.md.
      These are not part of the submission pack. There you may use QMDJ terms so the operator
      can see why. Map each output paragraph to requirement id, palace_id, phase/batch_id,
      verdict claim_id, evidence path, and quote.
    annotated_comments: >
      Write ANNOTATED/00_STATUS.md and inline ordinary-English annotations. No metaphysics jargon.
      Explain the situation, risks, timing, constraints, and what remains to be confirmed.
  verification_gate:
    mechanical_gates:
      geometry:
        description: "Selected palaces satisfy batch predicate as sets. Prove with field values."
        fail_action: "do not proceed"
      coverage:
        description: "Every Requirements-Matrix row is COVERED, EXCLUDED_LOGO, or UNCOVERED."
        fail_action: "zero silent UNCOVERED in SUBMISSION"
      consistency:
        description: "No VETO evidence supports a live claim. Every live claim has at least one SUPPORT citation."
        fail_action: "block claim or move to optional/uncertainty section if PDF allows"
      phase0:
        description: "P0_ANATOMY outputs exist and pass marker validation or log anomalies."
        fail_action: "do not start B1 unless closed-world anomaly policy applies"
      phase6:
        description: "P6_BOARD_SYNTHESIS outputs exist, patterns are computed, and yongshen is bound or explicitly unbound."
        fail_action: "return to P6_BOARD_SYNTHESIS"
    additional_checks:
      - "Assignment.pdf requirements are covered except excluded logo artwork."
      - "chart_metadata read before palaces"
      - "P0_ANATOMY completed before B1"
      - "B1 redone from scratch when redo is true"
      - "B1-B4 plus remaining palaces complete"
      - "P6_BOARD_SYNTHESIS completed before SYNTHESIZE"
      - "each solution slot is chart-grounded or explicitly labelled least-contradicted"
      - "contradictions logged and resolved or labelled"
      - "SUBMISSION is English-only and passes term linter"
      - "logo artwork excluded"
      - "operator comments isolated from submission pack"
      - "all stale dependencies rebuilt"
      - "source hashes unchanged"
      - "manifest checksums prepared"
    gate_type: "executable procedure, not theatre"
  red_team:
    enabled: true
    mode: "REDTEAM"
    output: "wiki/Red-Team.md"
    task: >
      Try to break the live solution using remaining palaces, Phase 6 board synthesis, PDF hard
      constraints, coverage gaps, forbidden-term leakage, logo boundary violations, overloaded
      palace claims, and ungrounded claims.
    precedence_rule: "If red-team finds a PDF hard-constraint violation, that outranks a chart nice-to-have."

agent_loop:
  state: "INIT"
  durable_state_file: "raw/state/machine.json"
  on_boot:
    - "if raw/state/machine.json exists, resume from recorded state unless redo instruction requires PURGE_B1"
    - "if source hashes changed, enter SOURCE_CHANGED"
    - "if no state exists, start INIT"
  states:
    INIT:
      do:
        - "create vault folders if missing"
        - "generate run_id if absent"
        - "record source file sha256 hashes"
        - "initialise machine.json, palaces.json, solution.json, progress.md"
        - "copy source metadata into raw notes with provenance"
      next: "CHART_INGEST"
    CHART_INGEST:
      do:
        - "execute chart_ingest procedure"
        - "write chart schema, chart index, stem parsing readiness, and geometry bind"
      next: "P0_ANATOMY"
    P0_ANATOMY:
      do:
        - "execute qmdj_complete.phases.P0_ANATOMY"
        - "write schema_bind, pillars, season, duty, indexes, origin_sets, lodging, yongshen candidates"
        - "update heartbeat with phase0 summary"
      next: "PDF_INGEST"
    PDF_INGEST:
      do:
        - "execute assignment_ingest procedure"
        - "write DeliverableRegistry, Requirements-Matrix, Logo-Boundary, Rubric-Guess, Assignment-Corpus"
        - "bind yongshen candidates where PDF question types allow"
      next: "PURGE_B1"
    PURGE_B1:
      do:
        - "if B1 redo is required, execute purge_policy.B1_redo"
        - "otherwise verify no stale B1-only claims remain"
      next: "B1"
    B1:
      do:
        - "execute batch_engine.batches.B1 from scratch"
      next: "B2"
    B2:
      do:
        - "execute batch_engine.batches.B2"
      next: "B3"
    B3:
      do:
        - "execute batch_engine.batches.B3"
      next: "B4"
    B4:
      do:
        - "execute batch_engine.batches.B4"
      next: "B5"
    B5:
      do:
        - "execute batch_engine.batches.B5"
      next: "P6_BOARD_SYNTHESIS"
    P6_BOARD_SYNTHESIS:
      do:
        - "execute qmdj_complete.phases.P6_BOARD_SYNTHESIS"
        - "write systems.json, relations.json, patterns.json"
        - "update Chart-Board-Synthesis and Chart-Patterns wiki articles"
        - "bind yongshen with PDF and rank paths operator-only"
      next: "SYNTHESIZE"
    SYNTHESIZE:
      do:
        - "rebuild wiki articles from cards, traces, indexes, systems, and patterns"
        - "freeze Solution-Live into final solution state"
        - "run verification_gate"
        - "run red_team"
      on_fail: "AUDIT_FIX"
      on_pass: "RENDER_OUTPUT"
    AUDIT_FIX:
      do:
        - "list failing claims and failing gates"
        - "re-read cited palaces, indexes, patterns, and requirement anchors"
        - "patch wiki, solution state, and output mappings"
        - "re-run verification_gate"
      max_cycles: 3
      on_max_cycles: >
        Write failures to audit log. Do not ship vetoed claims.
        Continue only with clearly labelled uncertainty where PDF allows.
      next: "RENDER_OUTPUT"
    RENDER_OUTPUT:
      do:
        - "write every artefact in DeliverableRegistry except excluded logo artwork"
        - "write SUBMISSION tree from registry"
        - "write ANNOTATED tree with ordinary English commentary and status"
        - "write OPERATOR tree with COMMENTS.md, MAPPINGS.md, and PATH_RANK.md"
        - "write output/MANIFEST.md listing files, hashes, and requirements satisfied"
      next: "HALT"
    HALT:
      do:
        - "write final manifest with checksums"
        - "write machine.json state HALT with timestamp"
        - "stop; do not wait for user input"
    SOURCE_CHANGED:
      do:
        - "record changed source hash or newly added explicit fields"
        - "invalidate affected state"
        - "if explicit slots or pattern fields appear, treat them as EXPLICIT and rebind"
        - "produce OPERATOR/FAILURE.md if continuation is unsafe"
        - "do not ask user"
      next: "FAILURE_OR_RESTART_FROM_SAFE_STATE"
    FAILURE:
      do:
        - "produce OPERATOR/FAILURE.md describing gap without asking questions"
        - "produce partial artefacts where safe"
        - "write manifest of failure state"
      next: "HALT"

modes:
  - name: "INGEST"
    job: "PDF + JSON -> schema, matrix, hash, registry"
  - name: "ANATOMY"
    job: "Phase 0 pillars, season, duty, indexes, origin sets, lodging, validation"
  - name: "GEOM"
    job: "batch predicate, opposition, traces, sets, proxies as deterministic functions"
  - name: "READ"
    job: "palace card creation from JSON plus retrieved context and palace stack"
  - name: "PATCH"
    job: "solution.json, palace cards, wiki DAG, annotations, indexes, relations"
  - name: "SYSTEMS"
    job: "Phase 6 board maps, matrices, inner/outer, pillars x palaces, centre reconstitution"
  - name: "PATTERNS"
    job: "computed pattern catalog, conservative naming, evidence paths"
  - name: "WRITE"
    job: "SUBMISSION and ANNOTATED artefacts"
  - name: "LINT"
    job: "terms, coverage, veto, schema, geometry, stale dependencies, marker validation"
  - name: "REDTEAM"
    job: "attack the live solution from chart, board synthesis, PDF, and coverage gaps"
  - name: "PATH_RANK"
    job: "operator-only computed ranking of paths vs traps"
  anti_pattern: "Do not spin multiple chattering personas that desynchronise the vault."

palace_analysis:
  method: "Use qmdj_complete schema_bind and palace_stack for every selected palace."
  required_reading_source:
    - "#/qmdj_complete/schema_bind"
    - "#/qmdj_complete/palace_stack"
    - "#/qmdj_complete/palace_identity_table"
    - "#/qmdj_complete/strength_scale"
    - "#/qmdj_complete/interpretation_protocol_v2"
  rule: >
    Analysis is not a memorised textbook list and not a slogan. For every selected palace,
    execute S1-S12. Record every field named by schema_bind. Compute S8 relations.
    Pull S9 index occurrences. Append S10 roles. Emit S11 typed verdicts. Patch S12 state.
  unknown_fields:
    treatment: "first-class evidence"
    storage: "raw trace, palace card, and opaque evidence state"
  palace_card_shape:
    json_first: true
    markdown_view_generated_from_json: true
    append_only_roles: true
    role_overlay_schema:
      palace_id: "string"
      roles: []
      analyses: []
      relations: []
      verdicts: []
    role_example:
      batch: "B1"
      role: "primary_day"
    analysis_example:
      role: "primary_day"
      fields_read: []
      relations: []
      notes: "string"
      verdicts: []

schemas:
  machine_state:
    type: "object"
    required:
      - "run_id"
      - "state"
      - "completed_batches"
      - "completed_phases"
      - "palaces"
      - "solution_revision"
      - "verification"
    properties:
      run_id:
        type: "string"
      state:
        type: "string"
      completed_batches:
        type: "array"
        items:
          type: "string"
      completed_phases:
        type: "array"
        items:
          type: "string"
      palaces:
        type: "object"
      solution_revision:
        type: "integer"
      verification:
        type: "object"
        properties:
          last_pass:
            type: "boolean"
          failures:
            type: "array"
      updated_at:
        type: "string"
  palace_card:
    type: "object"
    required:
      - "palace_id"
      - "roles"
      - "analyses"
      - "relations"
      - "verdicts"
    properties:
      palace_id:
        type: "string"
      canonical_name:
        type: "string"
      roles:
        type: "array"
        items:
          type: "object"
          properties:
            phase:
              type: "string"
            batch:
              type: "string"
            role:
              type: "string"
      analyses:
        type: "array"
        items:
          type: "object"
          properties:
            role:
              type: "string"
            fields_read:
              type: "array"
            notes:
              type: "string"
      relations:
        type: "array"
      verdicts:
        type: "array"
        items:
          type: "object"
  verdict:
    type: "object"
    required:
      - "claim_id"
      - "slot"
      - "text_en"
      - "polarity"
      - "confidence"
      - "grounding"
      - "evidence"
      - "phase"
      - "batch"
      - "status"
    properties:
      claim_id:
        type: "string"
      slot:
        type: "string"
        enum:
          - "my_answers"
          - "hidden_problems"
          - "best_solution"
          - "timing"
          - "risk"
          - "coverage"
          - "yongshen"
      text_en:
        type: "string"
      polarity:
        type: "string"
        enum:
          - "SUPPORT"
          - "VETO"
          - "CONSTRAIN"
          - "SEQUENCE"
          - "WARN"
          - "SILENT"
      confidence:
        type: "number"
        minimum: 0
        maximum: 1
      grounding:
        type: "string"
        enum:
          - "EXPLICIT"
          - "COMPUTED"
          - "INFERRED"
      evidence:
        type: "array"
        items:
          type: "object"
          required:
            - "palace_id"
            - "path"
            - "value"
          properties:
            palace_id:
              type: "string"
            path:
              type: "string"
            value:
              type: "string"
      phase:
        type: "string"
      batch:
        type: "string"
      status:
        type: "string"
        enum:
          - "live"
          - "superseded"
          - "vetoed"
  solution_live:
    type: "object"
    required:
      - "revision"
      - "answers"
      - "hidden_problems"
      - "best_solution"
      - "open_questions"
      - "evidence"
      - "split_claims"
    properties:
      revision:
        type: "integer"
      answers:
        type: "array"
      hidden_problems:
        type: "array"
      best_solution:
        type: "object"
      open_questions:
        type: "array"
        description: "internal only; never ship as final answers"
      evidence:
        type: "array"
      split_claims:
        type: "array"
  requirement:
    type: "object"
    required:
      - "id"
      - "quoted_text"
      - "page_anchor"
      - "artefact_type"
      - "must_level"
      - "except_logo"
      - "coverage_status"
    properties:
      id:
        type: "string"
      quoted_text:
        type: "string"
      page_anchor:
        type: "string"
      artefact_type:
        type: "string"
      must_level:
        type: "string"
        enum:
          - "must"
          - "should"
          - "may"
          - "must_not"
      except_logo:
        type: "boolean"
      coverage_status:
        type: "string"
        enum:
          - "UNCOVERED"
          - "COVERED"
          - "EXCLUDED_LOGO"
          - "BLOCKED"
      output_files:
        type: "array"
  deliverable:
    type: "object"
    required:
      - "id"
      - "name"
      - "format"
      - "audience"
      - "must_or_should"
      - "except_logo"
      - "source_requirement_ids"
      - "output_path"
    properties:
      id:
        type: "string"
      name:
        type: "string"
      format:
        type: "string"
      mime_type:
        type: "string"
      audience:
        type: "string"
      must_or_should:
        type: "string"
      except_logo:
        type: "boolean"
      source_requirement_ids:
        type: "array"
      output_path:
        type: "string"
      status:
        type: "string"
  origin_set:
    type: "object"
    required:
      - "target_stem"
      - "heaven_hits"
      - "proxy_hits"
      - "anomalies"
    properties:
      target_stem:
        type: "string"
      heaven_hits:
        type: "array"
      proxy_hits:
        type: "array"
      anomalies:
        type: "array"
  pattern_hit:
    type: "object"
    required:
      - "name_en"
      - "palaces"
      - "evidence_paths"
      - "polarity"
      - "grounding"
    properties:
      name_en:
        type: "string"
      palaces:
        type: "array"
      evidence_paths:
        type: "array"
      polarity:
        type: "string"
      grounding:
        type: "string"
        enum:
          - "COMPUTED"
          - "EXPLICIT"
      school_variant:
        type: "boolean"

