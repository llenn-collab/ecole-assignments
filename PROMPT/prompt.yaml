      "status": "live"
    }
  computed_pattern_example: |
    {
      "name_en": "forced_door",
      "palaces": ["2", "7"],
      "evidence_paths": [
        "$.palaces['2'].door.forced",
        "$.palaces['7'].door.forced"
      ],
      "polarity": "CONSTRAIN",
      "grounding": "COMPUTED"
    }
  submission_paragraph_example: |
    The recommended concept positions the brand as dependable and modern. The message hierarchy
    begins with the user benefit, then supports it with proof points, and closes with a clear call
    to action. The visual direction is described in words and excludes final artwork files.
  annotated_paragraph_example: |
    This section leads with benefit because the brief rewards clarity and audience fit.
    The main risk is over-styling the message. Keep the proof points short and avoid
    introducing claims not supported by the assignment constraints.
  operator_comment_example: |
    SUBMISSION paragraph 3 maps to requirement R-04. Chart support: palace 9, B1, field
    best_solution, polarity SUPPORT. Hidden constraint from palace 2, B1, polarity CONSTRAIN.
    Phase 6 path rank places movement/show path above coerced method.

non_goals:
  - "No logo artwork unless PDF explicitly requires a non-excluded textual artefact."
  - "No SVG/path/construction sheet unless PDF demands text description only."
  - "No QMDJ lecture in SUBMISSION."
  - "No questions to the user."
  - "No web research unless a requirement demands live facts and the chart is silent."
  - "No multi-agent chattering that desynchronises the vault."
  - "No fixed output template overriding the PDF deliverable registry."
  - "No rebuilding chart plates from textbook memory."
  - "No naming school patterns unless both required pieces exist in JSON."

residual_risk: >
  Interpretation of chart symbols into concrete assignment decisions remains underdetermined unless
  QMDJ.json contains explicit answer, hidden-problem, best-solution, yongshen, or pattern fields,
  or unless an operator-owned InterpretationProtocol is provided. This specification therefore requires:
  prefer explicit JSON fields; use computed deterministic evidence with path citations; treat inferred
  readings as hypotheses until confirmed; never present a hypothesis as a verdict.

boot_command: |
  Load Assignment.pdf and QMDJ.json into vault/raw/.
  If raw/state/machine.json exists, resume from state; if B1 redo is required, run PURGE_B1.
  Verify source hashes, run CHART_INGEST, then P0_ANATOMY, then PDF_INGEST.
  Run B1-B5, then P6_BOARD_SYNTHESIS, then SYNTHESIZE to HALT.
  Deliver vault/output/SUBMISSION/ as the submission pack, with vault/output/ANNOTATED/ for situation
  commentary and vault/output/OPERATOR/ for operator-only mappings and path rank.
