    - "Yin Earth"
    - "Yang Metal"
    - "Yin Metal"
    - "Yang Water"
    - "Yin Water"
    - "the day palace"
    - "the hour palace"
    - "chart-reading slang"
  archetype_scoring_rubric:
    version: "1.0.0"
    version_hash: "sha256:archetype_scoring_rubric_1_0_0_assignment_solver_v4"
    weights:
      grounding_tier: 0.35
      corroboration: 0.25
      contradiction_penalty: 0.20
      board_consistency: 0.10
      requirement_fit: 0.10
    grounding_tier_scores:
      EXPLICIT: 1.0
      COMPUTED: 0.6
      INFERRED: 0.3
    corroboration_rule: "normalised count of independent supporting evidence paths across the package"
    contradiction_penalty_rule: "1.0 minus normalised count of unresolved contradicting evidence"
    board_consistency_rule: "1.0 if candidate passes cross-palace consistency check carried in package, else 0"
    requirement_fit_rule: "Prompt 2 uses solution_engine.requirement_fit; Prompt 1 output must have used 0"
    tie_break_order:
      - "higher grounding_tier"
      - "higher corroboration"
      - "lower contradiction_penalty"
      - "earlier phase of first appearance (P0 over B5 over P6, i.e. more structural evidence wins)"
    unresolved_tie_policy: >
      Do not silently pick one. Emit both as split candidates in LAYER_A with status STILL_TIED
      and let OPERATOR/PATH_RANK.md show both.

qmdj_reference:
  expected_interpretation_protocol_v2_version_hash: "sha256:protocol_v2_2_1_0_chart_analyst_v4"
  note: >
    Prompt 2 does not contain full QMDJ geometry tables. It trusts chart_analysis_package.json
    as the verbatim output of Prompt 1. If package hashes do not match this reference, halt.

tools:
  runtime_policy: "Bind to whatever the runtime exposes. Prefer explicit tool schemas over hints."
  path_policy:
    deny_read:
      - "QMDJ.json"
    deny_write:
      - "chart_analysis_package.json"
      - "Assignment.pdf"
  tool_failure_branch:
    action: >
      If any tool returns an error_code, do not improvise recovery. Log ANOMALY:TOOL_FAILURE_{code},
      invalidate current phase, and transition to FAILURE state unless retry_count < 3.
  tool_schemas:
    - name: "read_file"
      purpose: "Read text or JSON from assignment/package/state files. Must not read QMDJ.json."
      input_schema:
        type: "object"
        required: ["path"]
        properties:
          path:
            type: "string"
      output_schema:
        type: "object"
        properties:
          content:
            type: "string"
          hash:
            type: "string"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["TIMEOUT", "FILE_NOT_FOUND", "PERMISSION_DENIED", "DENIED_PATH"]
          message:
            type: "string"
    - name: "write_file"
      purpose: "Write small cited artefacts, state files, and output files."
      input_schema:
        type: "object"
        required: ["path", "content"]
        properties:
          path:
            type: "string"
          content:
            type: "string"
          overwrite:
            type: "boolean"
      output_schema:
        type: "object"
        properties:
          status:
            type: "string"
          path:
            type: "string"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["TIMEOUT", "PERMISSION_DENIED", "QUOTA_EXCEEDED", "DENIED_PATH"]
          message:
            type: "string"
    - name: "pdf_extract"
      purpose: "Extract text, page anchors, tables, and images from Assignment.pdf."
      input_schema:
        type: "object"
        required: ["path"]
        properties:
          path:
            type: "string"
          pages:
            type: "array"
          extract_images:
            type: "boolean"
      output_schema:
        type: "object"
        properties:
          text:
            type: "string"
          pages:
            type: "array"
          images:
            type: "array"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["MALFORMED_PDF", "FILE_NOT_FOUND", "TIMEOUT"]
          message:
            type: "string"
    - name: "json_load"
      purpose: "Load chart_analysis_package.json or state JSON without mutation."
      input_schema:
        type: "object"
        required: ["path"]
        properties:
          path:
            type: "string"
      output_schema:
        type: "object"
        properties:
          data:
            type: "object"
          hash:
            type: "string"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["MALFORMED_JSON", "FILE_NOT_FOUND", "DENIED_PATH"]
          message:
            type: "string"
    - name: "hash_file"
      purpose: "Compute sha256 hash for provenance and manifest."
      input_schema:
        type: "object"
        required: ["path"]
        properties:
          path:
            type: "string"
      output_schema:
        type: "object"
        properties:
          sha256:
            type: "string"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["FILE_NOT_FOUND", "DENIED_PATH"]
          message:
            type: "string"
    - name: "validate_schema"
      purpose: "Validate package and state objects against schemas."
      input_schema:
        type: "object"
        required: ["data", "schema_ref"]
        properties:
          data:
            type: "object"
          schema_ref:
            type: "string"
      output_schema:
        type: "object"
        properties:
          valid:
            type: "boolean"
          errors:
            type: "array"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["INVALID_SCHEMA_REF"]
          message:
            type: "string"
    - name: "lint_terms"
      purpose: "Fail if forbidden QMDJ terms appear in SUBMISSION files."
      input_schema:
        type: "object"
        required: ["path", "denylist_path"]
        properties:
          path:
            type: "string"
          denylist_path:
            type: "string"
      output_schema:
        type: "object"
        properties:
          pass:
            type: "boolean"
          violations:
            type: "array"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["FILE_NOT_FOUND"]
          message:
            type: "string"
    - name: "retrieve"
      purpose: "Pull relevant package slices, requirement rows, and prior verdicts before analysis."
      input_schema:
        type: "object"
        required: ["query"]
        properties:
          query:
            type: "string"
          requirement_ids:
            type: "array"
          resolution_ids:
            type: "array"
      output_schema:
        type: "object"
        properties:
          package_slices:
            type: "array"
          state:
            type: "object"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["INDEX_CORRUPTED"]
          message:
            type: "string"
    - name: "render_markdown_from_json"
      purpose: "Generate human-readable output views from JSON state."
      input_schema:
        type: "object"
        required: ["source_json", "template", "target_md"]
        properties:
          source_json:
            type: "string"
          template:
            type: "string"
          target_md:
            type: "string"
      output_schema:
        type: "object"
        properties:
          status:
            type: "string"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["TEMPLATE_NOT_FOUND"]
          message:
            type: "string"
    - name: "compute_path_rank"
      purpose: "Compute final assignment-bound ranking from package archetype resolutions, requirement fit, and rubric."
      input_schema:
        type: "object"
        required:
          - "package_path"
          - "requirements_path"
          - "rubric_path"
        properties:
          package_path:
            type: "string"
          requirements_path:
            type: "string"
          rubric_path:
            type: "string"
      output_schema:
        type: "object"
        properties:
          candidates:
            type: "array"
            description: "per-candidate scores and score components, including requirement_fit"
          ordering:
            type: "array"
            description: "ranked archetype ids, or STILL_TIED split groups"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["FILE_NOT_FOUND", "RUBRIC_MISSING", "DENIED_PATH"]
          message:
            type: "string"
    - name: "compute_requirement_fit"
      purpose: "Compute requirement_fit_score for archetype candidates against DeliverableRegistry and Requirements-Matrix."
      input_schema:
        type: "object"
        required:
          - "candidates_path"
          - "requirements_path"
          - "deliverable_registry_path"
        properties:
          candidates_path:
            type: "string"
          requirements_path:
            type: "string"
          deliverable_registry_path:
            type: "string"
      output_schema:
        type: "object"
        properties:
          scored_candidates:
            type: "array"
      error_schema:
        type: "object"
        properties:
          error_code:
            type: "string"
            enum: ["FILE_NOT_FOUND"]
          message:
            type: "string"
  tool_use_rules:
    - "Prefer small, cited writes over one giant dump."
    - "Machine state is primary; Markdown is generated view."
    - "Do not read QMDJ.json under any circumstance."
    - "Do not write into chart_analysis_package.json."
    - "Do not reconstruct palace geometry."

operational:
  heartbeat:
    path: "raw/state/progress.md"
    update_frequency: "after every phase"
    format_examples:
      - "package validated | protocol hash ok | rubric hash ok"
      - "pdf ingest complete | requirements: 14 | uncovered: 3"
      - "solution_engine complete | best_solution winner: arch-04 | blockers: none"
  budgets:
    max_files_per_batch: 35
    max_chars_per_card: 6000
    max_audit_fix_cycles: 3
  max_audit_fix_cycles_exceeded_behavior:
    action: "HALT_IMMEDIATELY"
    output: "Write OPERATOR/FATAL_AUDIT_LOOP.md listing unresolved failures. Do not ship partial artefacts."
  image_handling:
    extract_pdf_images_to: "raw/assignment/images/"
    rule: "Cite extracted images. Do not recreate logo artwork."
  encoding:
    default: "UTF-8"
    chinese_filenames: "allowed"
    normalisation: "NFC"
  empty_pdf_policy:
    condition: "Assignment.pdf empty or unreadable"
    action: "halt into FAILURE and produce OPERATOR/FAILURE.md; do not ask questions"
  empty_package_policy:
    condition: "chart_analysis_package.json empty or unreadable"
    action: "halt into PACKAGE_STALE and produce OPERATOR/PACKAGE_STALE.md; do not ask questions"
  logging_levels:
    TRACE: "package slice dumps and full traces"
    INFO: "wiki articles and state changes"
    SUBMISSION: "clean output only"
  checksum_manifest:
    required_at_halt: true
    fields:
      - "file path"
      - "sha256"
      - "requirement ids"
      - "deliverable id"
      - "tree"
      - "package_version"
      - "source_qmdj_sha256"
      - "interpretation_protocol_v2_version_hash"
      - "archetype_scoring_rubric_version_hash"

regression_harness:
  requirement: "Before any new version of Prompt 2 is deployed, it must pass the assignment-package test suite."
  fixtures:
    - "tests/golden_assignment_01.pdf"
    - "tests/golden_package_01.json"
    - "tests/golden_assignment_02.pdf"
    - "tests/golden_package_02.json"
  assertions:
    - "chart_analysis_package.json must validate against schemas.chart_analysis_package"
    - "Prompt 2 completes with zero tool calls reading QMDJ.json"
    - "P7_SLOT_BIND produces yongshen bindings tied to PDF question types"
    - "final best_solution archetype_resolution winner + score must match golden baseline"
    - "SUBMISSION passes forbidden-term linter"
    - "LAYER_A document contract sections appear in required order"
  fail_action: "Reject prompt deployment if any assertion fails."

non_goals:
  - "No re-deriving palace geometry inside Prompt 2."
  - "No re-running B1-B5 or Phase 6."
  - "No reading raw QMDJ.json."
  - "No logo artwork unless PDF explicitly requires a non-excluded textual artefact."
  - "No QMDJ lecture in SUBMISSION."
  - "No questions to the user."
  - "No web research unless a requirement demands live facts and the package is silent."
  - "No fixed output template overriding the PDF deliverable registry."
  - "No silent tie-breaking outside the documented rubric."
  - "No reconstructing missing package fields."

boot_command: |
  Load Assignment.pdf and chart_analysis_package.json into vault/raw/.
  If raw/state/machine.json exists, resume from state.
  Verify package integrity first. If package is stale or invalid, enter PACKAGE_STALE.
  Run PDF_INGEST, then P7_SLOT_BIND, then SOLUTION_ENGINE, then SYNTHESIZE to RENDER_OUTPUT and HALT.
  Deliver vault/output/SUBMISSION/, vault/output/ANNOTATED/, vault/output/LAYER_A/,
  vault/output/OPERATOR/, and vault/output/MANIFEST.md.
