# pattern_catalog — annex A-patterns. Registry only: ids, required evidence classes,
# deterministic rules, and controlled-term vocabulary for C-atoms. NO findings here.
# A class absent from the chart yields a null result, not an error.
catalog_version: PC-1.0
compute_always: [PAT-01, PAT-02, PAT-03, PAT-04, PAT-05, PAT-27, PAT-28, PAT-31, PAT-32]
compute_on_explicit_marker: [PAT-06, PAT-07, PAT-08, PAT-09, PAT-10, PAT-11, PAT-12, PAT-13, PAT-14,
                             PAT-15, PAT-16, PAT-17, PAT-18, PAT-19, PAT-20, PAT-21, PAT-22, PAT-23,
                             PAT-24, PAT-25, PAT-26]
class_null_ok: [PAT-29, PAT-30]

# family_opposition: for the contradiction term of the score card (CAP-15 step 2). Deterministic,
# declared here so the penalty is enumerated rather than argued. A live hit contributes a
# contradiction point to another hit when the other hit's family appears in this map AND the two
# sit in the same palace or in an opposition pair (1-4, 6-9).
family_opposition:
  gate_vs_palace:   [gate_vs_palace]
  authority_rise:   [metal_clash, net, concealed_loss, tomb]
  metal_clash:      [authority_rise, shelter, stem_support]
  shelter:          [metal_clash, concealed_loss, punishment]
  concealed_loss:   [authority_rise, shelter, three_wonders]
  net:              [authority_rise, three_wonders, flexibility]
  three_wonders:    [net, punishment, tomb, concealed_loss]
  punishment:       [three_wonders, shelter, flexibility]
  stem_combination: [stem_clash, net]
  stem_clash:       [stem_combination, stem_support]
  stem_support:     [stem_clash, metal_clash]
  tomb:             [three_wonders, authority_rise]
  flexibility:      [net, punishment]
  branch_relations: []
  axis_anchor:      []
  absence_class:    []

patterns:
  - {id: PAT-01, cn: 门迫宫, roman: men_po_gong, family: gate_vs_palace, source: both,
     required_evidence_classes: [door, palaces_root], rule: "element_controls(door_element, palace_element)",
     controlled_terms: [pressure, friction, effort_over_yield, adverse_reversal],
     null_ok: true, gloss: "human agency acts against its environment"}
  - {id: PAT-02, cn: 宫生门, roman: gong_sheng_men, family: gate_vs_palace, source: both,
     required_evidence_classes: [door, palaces_root], rule: "element_generates(palace_element, door_element)",
     controlled_terms: [support, tailwind, low_friction], null_ok: true,
     gloss: "environment feeds the actor"}
  - {id: PAT-03, cn: 六仪击刑, roman: liu_yi_ji_xing, family: punishment, source: both,
     required_evidence_classes: [heaven_stem, earth_stem, hidden_stem, lodged_stem, palaces_root],
     rule: "six_yi_stem.palace_bound_by_source == frozen_tables.liu_yi_xing[stem].palace",
     controlled_terms: [penalty, sudden_breakage, self_inflicted_strain], null_ok: true,
     gloss: "a 仪 sits in its punishment palace"}
  - {id: PAT-04, cn: 星入墓, roman: xing_ru_mu, family: tomb, source: both,
     required_evidence_classes: [star, palaces_root],
     rule: "element_tomb[star_element].palace == palace_canonical",
     controlled_terms: [stored_energy, exhausted_timing, latency], null_ok: true,
     gloss: "a star falls into its element's tomb"}
  - {id: PAT-05, cn: 奇仪相合, roman: qi_yi_xiang_he, family: stem_combination, source: both,
     required_evidence_classes: [heaven_stem, earth_stem],
     rule: "pair_in_frozen_tables.stem_he",
     controlled_terms: [bond, alliance, joint_undertaking, entangling_agreement], null_ok: true,
