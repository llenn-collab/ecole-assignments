mily="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Both straps fastened.</text><text x="28" y="643" fill="#F2F0E5" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400">Check before you ride. Never while riding.</text><text x="28" y="691" fill="#587167" font-family="Arial, Helvetica, sans-serif" font-size="7.7" font-weight="700">THIS SEAT HAS A HEAD. / STUDENT PROTOTYPE</text></svg>
