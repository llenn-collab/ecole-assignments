<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="420mm" viewBox="0 0 595 842" role="img"><title>Two seats. Two helmets. Both fastened.</title><desc>Riding together? Check each other before you leave. Use a well-fitting BIS-certified motorcycle helmet.</desc><rect x="0" y="0" width="595" height="842" rx="0" fill="#F2F0E5"/><rect x="32" y="50" width="531" height="3" rx="0" fill="#172C28"/><text x="32" y="84" fill="#587167" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">A REMINDER FOR BOTH OF YOU</text><text x="32" y="168" fill="#172C28" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="700">TWO</text><text x="32" y="253" fill="#172C28" font-family="Arial, Helvetica, sans-serif" font-size="79" font-weight="700">SEATS.</text><rect x="32" y="303" width="531" height="169" rx="12" fill="#DEEF54"/><path d="M 88 413.75 C 84.37 331.47 190.85 318.15999999999997 209 391.97 L 175.12 391.97 L 175.12 417.38 L 136.4 429.48 L 102.52 424.64 Z" fill="#172C28"/><line x1="124.3" y1="423.43" x2="129.14" y2="440.37" stroke="#172C28" stroke-width="4.235"/><line x1="129.14" y1="440.37" x2="166.65" y2="429.48" stroke="#172C28" stroke-width="4.235"/><path d="M 356 413.75 C 352.37 331.47 458.85 318.15999999999997 477 391.97 L 443.12 391.97 L 443.12 417.38 L 404.4 429.48 L 370.52 424.64 Z" fill="#172C28"/><line x1="392.3" y1="423.43" x2="397.14" y2="440.37" stroke="#172C28" stroke-width="4.235"/><line x1="397.14" y1="440.37" x2="434.65" y2="429.48" stroke="#172C28" stroke-width="4.235"/><text x="32" y="532" fill="#172C28" font-family="Arial, Helvetica, sans-serif" font-size="53" font-weight="700">TWO HELMETS.</text><text x="32" y="590" fill="#172C28" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700">BOTH FASTENED.</text><line x1="32" y1="624" x2="563" y2="624" stroke="#172C28" stroke-width="1"/><text x="32" y="662" fill="#172C28" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Riding together?</text><text x="32" y="693" fill="#172C28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Check each other before you leave.</text><text x="32" y="755" fill="#587167" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400">Use a well-fitting BIS-certified motorcycle helmet.</text><text x="32" y="804" fill="#587167" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700">THIS SEAT HAS A HEAD. / STUDENT CAMPAIGN PROTOTYPE</text></svg>
