<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>This seat has a head / 15-second motion prototype</title><style>body{margin:0;background:#172C28;color:#F2F0E5;font:18px Arial;display:grid;place-items:center;min-height:100vh}.wrap{width:min(90vw,440px)}.frame{aspect-ratio:9/16;max-height:78vh;background:#F2F0E5;color:#172C28;padding:8%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(32px,7vw,56px);line-height:1.04}p{line-height:1.5}.badge{font-size:11px;letter-spacing:.1em}button{padding:12px 20px;background:#DEEF54;border:0;border-radius:4px;font-weight:bold;cursor:pointer;margin:14px 6px 0 0}.symbol{font-size:60px;font-weight:bold;color:#587167}small{display:block;font-size:12px;line-height:1.5;margin:10px 0}progress{width:100%;accent-color:#DEEF54}.card{background:#172C28;color:#F2F0E5;padding:20px;font-size:30px;font-weight:bold}.hidden{display:none}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style><div class="wrap"><div class="frame" aria-live="polite"><div class="badge">ILLUSTRATED STUDENT PROTOTYPE / NOT DEPLOYED</div><div class="symbol" id="symbol">01</div><h1 id="title">One bike.</h1><p id="caption">A parked two-wheeler. Engine off. No one has mounted.</p><div class="card hidden" id="card">THIS SEAT<br>HAS A HEAD.<br><span style="color:#DEEF54">YOURS.</span></div></div><progress id="progress" max="15" value="0" aria-label="Sequence progress"></progress><button id="play">Play 15 seconds</button><button id="pause">Pause</button><button id="next">Next frame</button><small>No sound. All meaning is captioned. No flashing or hearing/crash simulation. Manual frame navigation is available.</small></div><script>const scenes=[{at:0,title:'One bike.',caption:'A parked two-wheeler. Engine off. No one has mounted.',symbol:'01'},{at:3,title:'Two people.',caption:'The message rests on the second seat, with consent and supervision.',symbol:'02',card:true},{at:6,title:'Two helmets. Both fastened.',caption:'Each person needs their own suitable helmet, chinstrap fastened.',symbol:'02 / 02'},{at:10,title:'Check each other before you ride.',caption:'Facilitator collects the card before anyone mounts. Both helmets on. Both straps fastened.',symbol:'BEFORE'}];let timer=null,time=0;const show=()=>{let s=scenes.filter(s=>s.at<=time).at(-1);document.getElementById('title').textContent=s.title;document.getElementById('caption').textContent=s.caption;document.getElementById('symbol').textContent=s.symbol;document.getElementById('card').classList.toggle('hidden',!s.card);document.getElementById('progress').value=time};document.getElementById('pause').onclick=()=>{clearInterval(timer);timer=null};document.getElementById('play').onclick=()=>{clearInterval(timer);time=0;show();timer=setInterval(()=>{time=Math.min(15,time+.1);show();if(time>=15){clearInterval(timer);timer=null}},100)};document.getElementById('next').onclick=()=>{clearInterval(timer);timer=null;time=(scenes.find(s=>s.at>time)||scenes[0]).at;show()};show();</script></html>
